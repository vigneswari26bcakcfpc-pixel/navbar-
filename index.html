<!DOCTYPE html>
<html>
<head>
    <title>Simple Navbar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:script, pacifico;
        }

        /* Navigation Bar */
        nav{
            background-color:#FFB6C1;
            height:50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 20px;
        }

        /* Logo */
        .logo{
            color:purple;
            font-size:22px;
            font-weight:bold;
        }

        /* Menu */
        ul{
            list-style:none;
            display:flex;
        }

        ul li{
            margin-left:20px;
        }

        ul li a{
            text-decoration:none;
            color:light pink;
            font-size:16px;
            transition:0.3s;
        }

        ul li a:hover{
            color:violet;
        }

        /* Content */
        .content{
            text-align:center;
            margin-top:80px;
        }
    </style>

</head>
<body>

    <nav>
        <div class="logo">MyWebsite</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This is a simple navigation bar using HTML and CSS.</p>
    </div>

</body>
</html>
